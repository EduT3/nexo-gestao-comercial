name: NEXO Windows
on:
  push:
    branches: [feat/nexo-balcao, main]
  workflow_dispatch:
    inputs:
      receipt_source_run:
        description: Successful Windows run containing the 1.0.6 installer with update receipts
        type: string
        required: false
      receipt_source_sha256:
        description: SHA-256 of the 1.0.6 source installer
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - name: Set unpublished update test version
        shell: pwsh
        env:
          RECEIPT_SOURCE_RUN: ${{ inputs.receipt_source_run }}
          RECEIPT_SOURCE_SHA256: ${{ inputs.receipt_source_sha256 }}
        run: |
          $version = '1.0.8'
          if ($env:RECEIPT_SOURCE_RUN -or $env:RECEIPT_SOURCE_SHA256) {
            if ($env:RECEIPT_SOURCE_RUN -notmatch '^\d+$' -or $env:RECEIPT_SOURCE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
              throw 'Provide a source run ID and a valid SHA-256 digest'
            }
          }
          npm version $version --no-git-tag-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run package:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Stage previous public release
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'NEXO-Setup-1.0.4.exe'
          Invoke-WebRequest 'https://github.com/EduT3/nexo-gestao-comercial/releases/download/v1.0.4/NEXO-Setup-1.0.4.exe' -OutFile $setup
          if ((Get-FileHash -LiteralPath $setup).Hash -ne '830AC83A9038A521403FFF6A597FF09882B427E9E431429D402353CE495E6119') { throw 'Previous installer digest mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'NEXO-installed'
          $result = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$destination") -PassThru -Wait -WindowStyle Hidden
          if ($result.ExitCode -ne 0 -or !(Test-Path "$destination/NEXO.exe")) { throw 'Previous installation failed' }
          $snapshot = Join-Path $env:RUNNER_TEMP 'NEXO-previous-snapshot'
          Copy-Item -LiteralPath $destination -Destination $snapshot -Recurse
          "NEXO_QA_BASELINE=$snapshot" >> $env:GITHUB_ENV
          "NEXO_QA_PROGRAM=$destination" >> $env:GITHUB_ENV
          $candidate = Get-ChildItem artifacts/installer/NEXO-Setup-*.exe | Select-Object -First 1
          if (!$candidate) { throw 'Candidate installer missing' }
          "NEXO_QA_SETUP=$($candidate.FullName)" >> $env:GITHUB_ENV
      - run: node scripts/verify-cloud-windows.cjs
        env:
          NEXO_QA_PUBLIC_RELEASE: '1'
      - name: Test update from a Windows installer with Guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_SOURCE_RUN: ${{ inputs.receipt_source_run }}
          RECEIPT_SOURCE_SHA256: ${{ inputs.receipt_source_sha256 }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'nexo-guard-m1'
          $sourceRun = '43536830745'
          $sourceVersion = '1.0.5'
          $sourceHash = '4DC2325400FE5743FE0826B18266735EE570C0970520F24366B5D5779A5CB61A'
          if ($env:RECEIPT_SOURCE_RUN) {
            $sourceRun = $env:RECEIPT_SOURCE_RUN
            $sourceVersion = '1.0.6'
            $sourceHash = $env:RECEIPT_SOURCE_SHA256
            $env:NEXO_QA_REQUIRE_UPDATE_RECEIPT = '1'
            $conclusion = gh run view $sourceRun --repo EduT3/nexo-gestao-comercial --json conclusion --jq .conclusion
            if ($LASTEXITCODE -ne 0 -or $conclusion -ne 'success') { throw 'Source run must have passed' }
          }
          gh run download $sourceRun --repo EduT3/nexo-gestao-comercial --name nexo-windows --dir $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Join-Path $source "installer/NEXO-Setup-$sourceVersion.exe"
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ne $sourceHash) { throw 'Source installer digest mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'NEXO-Guard-installed'
          $result = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$destination") -PassThru -Wait -WindowStyle Hidden
          if ($result.ExitCode -ne 0 -or !(Test-Path "$destination/NEXO.exe")) { throw 'Guard M1 installation failed' }
          $snapshot = Join-Path $env:RUNNER_TEMP 'NEXO-Guard-snapshot'
          Copy-Item -LiteralPath $destination -Destination $snapshot -Recurse
          $env:NEXO_QA_BASELINE = $snapshot
          $env:NEXO_QA_PROGRAM = $destination
          $env:NEXO_QA_REQUIRE_GUARD_SOURCE = '1'
          $env:NEXO_QA_GUARD_SETUP = $setup
          node scripts/verify-cloud-windows.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verificar arquivos de distribuicao
        run: node scripts/verify-windows-artifacts.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nexo-windows
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.blockmap
            artifacts/installer/latest.yml
            artifacts/installer/package-audit.json
            artifacts/cloud-qa/**/result.json
            artifacts/cloud-qa/**/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nexo-windows-diagnostics
          path: |
            artifacts/cloud-qa/**/result.json
            artifacts/cloud-qa/**/*.png
          if-no-files-found: warn
          retention-days: 14
