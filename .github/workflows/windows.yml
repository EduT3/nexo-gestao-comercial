name: NEXO Windows
on:
  push:
    branches: [feat/nexo-balcao, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run package:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Stage previous public release
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'NEXO-Setup-1.0.4.exe'
          Invoke-WebRequest 'https://github.com/EduT3/nexo-gestao-comercial/releases/download/v1.0.4/NEXO-Setup-1.0.4.exe' -OutFile $setup
          if ((Get-FileHash -LiteralPath $setup).Hash -ne '830AC83A9038A521403FFF6A597FF09882B427E9E431429D402353CE495E6119') { throw 'Previous installer digest mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'NEXO-installed'
          $result = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$destination") -PassThru -Wait -WindowStyle Hidden
          if ($result.ExitCode -ne 0 -or !(Test-Path "$destination/NEXO.exe")) { throw 'Previous installation failed' }
          $snapshot = Join-Path $env:RUNNER_TEMP 'NEXO-previous-snapshot'
          Copy-Item -LiteralPath $destination -Destination $snapshot -Recurse
          "NEXO_QA_BASELINE=$snapshot" >> $env:GITHUB_ENV
          "NEXO_QA_PROGRAM=$destination" >> $env:GITHUB_ENV
          $candidate = Get-ChildItem artifacts/installer/NEXO-Setup-*.exe | Select-Object -First 1
          if (!$candidate) { throw 'Candidate installer missing' }
          "NEXO_QA_SETUP=$($candidate.FullName)" >> $env:GITHUB_ENV
      - run: node scripts/verify-cloud-windows.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexo-windows
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.blockmap
            artifacts/installer/latest.yml
            artifacts/installer/package-audit.json
            artifacts/cloud-qa/**/result.json
            artifacts/cloud-qa/**/*.png
          retention-days: 14
