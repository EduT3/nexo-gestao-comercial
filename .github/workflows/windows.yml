name: NEXO Windows
on:
  push:
    branches: [feat/nexo-balcao, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install in disposable Windows runner
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/installer/NEXO-Setup-*.exe | Select-Object -First 1
          if (!$setup) { throw 'Installer missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'NEXO-installed'
          $result = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$destination") -PassThru -Wait -WindowStyle Hidden
          if ($result.ExitCode -ne 0) { throw "Install failed $($result.ExitCode)" }
          if (!(Test-Path "$destination/NEXO.exe")) { throw 'Installed executable missing' }
          "NEXO_QA_PROGRAM=$destination" >> $env:GITHUB_ENV
      - run: node scripts/verify-cloud-windows.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexo-windows
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.blockmap
            artifacts/installer/latest.yml
            artifacts/cloud-qa/**
          retention-days: 14
