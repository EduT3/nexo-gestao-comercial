name: NEXO Windows
on:
  push:
    branches: [feat/nexo-balcao, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/verify-cloud-windows.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexo-windows
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.blockmap
            artifacts/installer/latest.yml
            artifacts/cloud-qa/**
          retention-days: 14
